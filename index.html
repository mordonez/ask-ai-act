<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ask-ai-act — clasificador del Reglamento europeo de IA</title>
    <style>
      :root {
        --ink: #1a1a1a;
        --ink-muted: #5a5a5a;
        --border: #ddd;
        --surface: #fff;
        --ground: #f6f6f4;
        --accent: #2874a6;
        --danger: #c0392b;
        --ok: #1e7a46;
        --warn: #b5760a;
        --info: #6c3fa0;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        max-width: 680px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
        line-height: 1.55;
        color: var(--ink);
        background: var(--ground);
      }
      header { margin-bottom: 1.75rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.3rem; }
      .subtitle { color: var(--ink-muted); font-size: 0.92rem; margin: 0; }
      .subtitle a { color: var(--accent); }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.5rem;
      }

      .question p:first-child { font-size: 1.05rem; margin-top: 0; }
      input[type="text"] {
        font: inherit;
        width: 100%;
        padding: 0.55rem 0.7rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        margin-top: 0.4rem;
      }
      input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      .eval-subject { color: var(--ink-muted); font-size: 0.85rem; margin: 0 0 0.2rem; }
      .examples { display: flex; gap: 0.75rem; flex-wrap: wrap; margin: 0.7rem 0; }
      .examples-col {
        flex: 1 1 220px;
        border-radius: 6px;
        padding: 0.55rem 0.75rem;
        font-size: 0.87rem;
      }
      .examples-si { background: color-mix(in srgb, var(--ok) 8%, var(--ground)); border: 1px solid color-mix(in srgb, var(--ok) 25%, var(--border)); }
      .examples-no { background: color-mix(in srgb, var(--danger) 6%, var(--ground)); border: 1px solid color-mix(in srgb, var(--danger) 20%, var(--border)); }
      .examples-label { display: block; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
      .examples-si .examples-label { color: var(--ok); }
      .examples-no .examples-label { color: var(--danger); }
      .examples-col ul { margin: 0; padding-left: 1.1rem; }
      .examples-col li { margin-bottom: 0.25rem; }
      .examples-col li:last-child { margin-bottom: 0; }
      .legal-ref { color: var(--ink-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.02em; margin: 0.6rem 0; }
      ul.links { list-style: none; padding: 0; margin: 0.4rem 0 0; display: flex; flex-direction: column; gap: 0.25rem; }
      ul.links a { color: var(--accent); font-size: 0.85rem; text-decoration: none; }
      ul.links a:hover { text-decoration: underline; }

      .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.1rem; }
      button {
        font: inherit;
        padding: 0.55rem 1.1rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        cursor: pointer;
        transition: background 0.1s ease;
      }
      button:hover { background: var(--ground); }
      button[data-answer="si"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      #restart, #download-csv { margin-top: 1rem; }

      #result { border-left: 4px solid var(--border); }
      #result strong { display: block; font-size: 1.1rem; margin-bottom: 0.4rem; }
      #result.alto_riesgo, #result.uso_prohibido { border-left-color: var(--danger); }
      #result.fuera_de_ambito, #result.sin_obligaciones_especificas { border-left-color: var(--ok); }
      #result.obligaciones_transparencia { border-left-color: var(--warn); }
      #result.modelo_uso_general { border-left-color: var(--info); }
      #result hr { border: none; border-top: 1px solid var(--border); margin: 1.1rem 0; }
      #result ul { padding-left: 1.2rem; }
      #result li { margin-bottom: 0.4rem; }

      #history { margin-top: 1.5rem; }
      #history h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-muted); margin-bottom: 0.6rem; }
      #history ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.4rem; }
      #history li {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.55rem 0.8rem;
        font-size: 0.85rem;
        display: flex;
        justify-content: space-between;
        gap: 0.6rem;
      }
      #history .h-date { color: var(--ink-muted); white-space: nowrap; }

      #resources { margin-top: 1.5rem; }
      #resources h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-muted); margin-bottom: 0.6rem; }
      #resources ul.links a { font-size: 0.88rem; }

      footer { margin-top: 2rem; font-size: 0.8rem; color: var(--ink-muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>ask-ai-act</h1>
      <p class="subtitle">
        Clasificador del Reglamento europeo de IA — árbol de reglas trazable, sin cuentas ni base de datos.
        No es asesoramiento legal. <a href="https://github.com/mordonez/ask-ai-act">Código y roadmap en GitHub</a>.
      </p>
    </header>
    <div id="app" class="card"></div>
    <div id="history"></div>
    <div id="resources"></div>
    <footer>Fase 1, muy temprana — <a href="https://github.com/mordonez/ask-ai-act/blob/main/docs/ROADMAP.md">qué falta todavía</a>.</footer>
    <script type="module" src="/src/ui/wizard.ts"></script>
  </body>
</html>
